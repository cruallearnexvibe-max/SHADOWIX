.card {
  width: 100%;
  max-width: 460px;
  padding: 22px 20px 22px;
  border: 3px solid transparent;
  border-radius: 34px;
  background:
    linear-gradient(var(--card), var(--card)) padding-box,
    var(--g) border-box;
  box-shadow:
    -10px 0 26px rgba(0, 220, 255, 0.35),
    10px 0 26px rgba(148, 0, 240, 0.38),
    0 12px 32px rgba(40, 60, 255, 0.32);
}

.field {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 70px;
  padding: 0 20px;
  border: 2px solid transparent;
  border-radius: 26px;
  background:
    linear-gradient(var(--field), var(--field)) padding-box,
    var(--g) border-box;
}
.field:focus-within {
  box-shadow: 0 0 0 3px rgba(40, 80, 255, 0.28);
}
.field.bad {
  background:
    linear-gradient(var(--field), var(--field)) padding-box,
    linear-gradient(90deg, #ff5252, #ff2d6f) border-box;
}
.field svg { flex: none; }
input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: 500 24px/1 "Inter", system-ui, sans-serif;
}
input::placeholder { color: var(--placeholder); opacity: 1; }
input:disabled { opacity: 0.6; }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 68px;
  margin-top: 16px;
  padding: 0 16px;
  border: 2px solid rgba(255, 255, 255, 0.45);
  border-radius: 999px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 48%) border-box,
    var(--g) border-box;
  background-origin: border-box;
  box-shadow:
    0 0 0 rgba(0, 170, 255, 0),
    0 0 0 rgba(148, 0, 240, 0),
    0 10px 24px rgba(60, 60, 255, 0.4),
    inset 0 2px 3px rgba(255, 255, 255, 0.55),
    inset 0 -4px 8px rgba(0, 0, 60, 0.25);
  color: #fff;
  font: 700 28px/1 "Inter", system-ui, sans-serif;
  text-decoration: none;
  text-shadow: 0 1px 2px rgba(0, 0, 60, 0.35);
  cursor: pointer;
  position: relative;
  isolation: isolate;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.35s ease, box-shadow 0.4s ease, border-color 0.4s ease;
}
.btn::before {
  content: "";
  position: absolute;
  inset: -2px;
  z-index: -1;
  border-radius: 999px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 48%),
    linear-gradient(90deg, #0090c0 0%, #0038b8 30%, #1b1a96 62%, #64009f 100%);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn:not([disabled]):is(:hover, :focus-visible, :active)::before { opacity: 1; }
.btn:not([disabled]):is(:hover, :focus-visible, :active) {
  transform: scale(1.015);
  border-color: rgba(255, 255, 255, 0.7);
  box-shadow:
    0 0 22px rgba(0, 170, 255, 0.8),
    0 0 46px rgba(148, 0, 240, 0.55),
    0 10px 24px rgba(60, 60, 255, 0.45),
    inset 0 2px 3px rgba(255, 255, 255, 0.4),
    inset 0 -4px 8px rgba(0, 0, 60, 0.3);
}
.btn:not([disabled]):active { transform: scale(0.99); }
.btn[disabled] { opacity: 0.7; cursor: progress; }

.msg {
  margin: 14px 0 0;
  text-align: center;
  font: 600 17px/1.4 "Inter", system-ui, sans-serif;
}
.msg:empty { margin: 0; }
.msg.err { color: var(--err); }
.msg.ok { color: var(--ok); }

.shake { animation: shake 0.35s; }
@keyframes shake {
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .shake { animation: none; }
  .btn, .btn::before { transition: none; }
  .btn:not([disabled]):is(:hover, :focus-visible, :active) { transform: none; }
}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="field" id="field">
    <svg width="30" height="36" viewBox="0 0 28 34" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00d2ff"/>
          <stop offset="1" stop-color="#7a1cf0"/>
        </linearGradient>
      </defs>
      <path d="M7.5 14V9.5a6.5 6.5 0 0 1 13 0V14" fill="none" stroke="url(#lg)" stroke-width="3.6" stroke-linecap="round"/>
      <rect x="1" y="13" width="26" height="20" rx="4.5" fill="url(#lg)"/>
      <circle cx="14" cy="21.5" r="2.6" fill="#fff"/>
      <rect x="12.7" y="22.5" width="2.6" height="6" rx="1.3" fill="#fff"/>
    </svg>
    <input id="pw" type="text" placeholder="Password" aria-label="Password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </div>

  <button class="btn" id="continue" type="button">Continue</button>
  <a class="btn" id="go" href="#" target="_blank" rel="noopener noreferrer" hidden>Download</a>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script>
var DATA = { salt: "q6mA4rWHoUsFVSUEjZpXbQ==", iv: "zzUBZA1i+cYmiMUk", ct: "FpgB/YGktuYpPXMAy7+UXegFApgotjiHEP9KCros/T+zr83VrhT0iIqUBQV4JAdfjtFJqVbVTHrT/47vslvxpRxBX08jjOMiH2JQfulcbsxKS9z8lm+G/rL/088pJMuQlA==", iter: 600000 };

function b64(s) {
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function unlock(password) {
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}

var pw = document.getElementById("pw");
var btn = document.getElementById("continue");
var go = document.getElementById("go");
var msg = document.getElementById("msg");
var card = document.getElementById("card");
var field = document.getElementById("field");

function say(text, kind) {
  msg.textContent = text;
  msg.className = "msg" + (kind ? " " + kind : "");
}

async function submit() {
  var value = pw.value.trim();
  field.classList.remove("bad");
  if (!value) { say("Enter the password", "err"); field.classList.add("bad"); pw.focus(); return; }
  btn.disabled = true;
  say("Checking…");
  try {
    var url = await unlock(value);
    if (url.indexOf("https://") !== 0) throw new Error("bad data");
    pw.disabled = true;
    btn.hidden = true;
    go.href = url;
    say("Password correct", "ok");
    window.location.href = url;
    setTimeout(function () { go.hidden = false; }, 1500);
  } catch (e) {
    btn.disabled = false;
    field.classList.add("bad");
    say("Incorrect password", "err");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    pw.select();
  }
}

btn.addEventListener("click", submit);
pw.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
pw.addEventListener("input", function () { field.classList.remove("bad"); });
</script>
</body>
</html>
